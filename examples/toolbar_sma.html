<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<!-- External Dependencies -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
	<style>

	/* ===================================================================
	   CSS CUSTOM PROPERTIES - Design System
	   =================================================================== */
	:root {
		/* Typography */
		--font-family: 'Barlow' ,'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		--font-size-xs: 11pt;
		--font-size-sm: 13pt;
		--font-size-base: 14pt;
		--font-weight-normal: 400;
		--font-weight-medium: 500;
		--font-weight-semibold: 600;

		/* Spacing System */
		--space-xs: 4px;
		--space-sm: 8px;
		--space-md: 12px;
		--space-lg: 16px;
		--space-xl: 20px;
		--space-xxl: 24px;

		/* Border Radius */
		--radius-sm: 4px;
		--radius-md: 6px;
		--radius-lg: 8px;

		/* Transitions - Removed for minimal design */
		/* --transition-fast: 0.15s ease-out; */
		/* --transition-normal: 0.2s ease-out; */

		/* Color Palette - Light Theme */
		--color-background: #ffffff;
		--color-surface: #f8f9fa;
		--color-border: #e9ecef;
		--color-text-primary: #212529;
		--color-text-secondary: #6c757d;
		--color-accent: #0D98D4;
		--color-accent-hover: #0b7aa3;
		--color-accent-light: #5BC8F5;
	}

	/* Dark Theme Color Overrides */
	[data-theme="dark"] {
		--color-background: #1a1a1a;
		--color-surface: #2d2d2d;
		--color-border: #404040;
		--color-text-primary: #ffffff;
		--color-text-secondary: #a6a6a6;
		--color-accent: #5BC8F5;
		--color-accent-hover: #4ab8e8;
		--color-accent-light: #0D98D4;
	}

	/* ===================================================================
	   BASE STYLES
	   =================================================================== */
	body {
		font-family: var(--font-family);
		font-size: var(--font-size-base);
		font-weight: var(--font-weight-normal);
		line-height: 1.5;
		color: var(--color-text-primary);
	}

	/* ===================================================================
	   TOOLBAR STYLES
	   =================================================================== */
	
	/* Main Toolbar Container */
	#potree_toolbar {
		/* Positioning */
		position: absolute;
		z-index: 10000;
		left: 50%;
		top: var(--space-xl);
		transform: translateX(-50%);
		
		/* Layout */
		display: flex;
		align-items: center;
		gap: var(--space-xxl);
		
		/* Visual */
		background: var(--color-background);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-lg);
		
		/* Spacing */
		padding: var(--space-lg) var(--space-xxl);
	}

	/* Toolbar Sections */
	.toolbar-section {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: var(--space-sm);
		position: relative;
	}

	/* Section Labels */
	.toolbar-label {
		font-size: var(--font-size-xs);
		font-weight: var(--font-weight-semibold);
		color: var(--color-text-secondary);
		text-transform: uppercase;
		letter-spacing: 0.5px;
		white-space: nowrap;
		text-align: center;
		margin-bottom: var(--space-xs);
	}

	/* Controls Container */
	.toolbar-controls {
		display: flex;
		align-items: center;
		gap: var(--space-sm);
	}

	/* Visual Separators */
	.toolbar-separator {
		width: 1px;
		height: 50px;
		background: var(--color-border);
		opacity: 0.6;
	}

	/* ===================================================================
	   CONTROL TOOLBAR (FLOATING)
	   =================================================================== */
	#potree_control_toolbar {
		/* Positioning */
		position: absolute;
		z-index: 10000;
		top: var(--space-xl);
		right: var(--space-xl);
		
		/* Layout */
		display: flex;
		align-items: center;
		gap: var(--space-sm);
		
		/* Visual */
		background: var(--color-background);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-lg);
		
		/* Spacing */
		padding: var(--space-md);
	}

	.control-btn {
		/* Layout */
		width: 36px;
		height: 36px;
		display: flex;
		align-items: center;
		justify-content: center;
		
		/* Visual */
		background: var(--color-surface);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-md);
		
		/* Interaction */
		cursor: pointer;
		
		/* Typography */
		font-size: var(--font-size-sm);
		user-select: none;
	}

	.control-btn:hover {
		background: var(--color-accent);
		border-color: var(--color-accent);
		color: white;
	}

	/* Hamburger menu lines */
	.hamburger {
		width: 16px;
		height: 12px;
		position: relative;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
	}

	.hamburger-line {
		width: 100%;
		height: 2px;
		background: currentColor;
		border-radius: 1px;
	}

	/* ===================================================================
	   ACTION BUTTONS
	   =================================================================== */
	.action-btn {
		/* Layout */
		width: 36px;
		height: 36px;
		display: flex;
		align-items: center;
		justify-content: center;
		
		/* Visual */
		background: var(--color-surface);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-md);
		
		/* Interaction */
		cursor: pointer;
		position: relative;
	}

	.action-btn:hover {
		background: var(--color-accent);
		border-color: var(--color-accent);
	}

	.action-btn.active {
		background: var(--color-accent);
		border-color: var(--color-accent);
		color: white;
	}

	/* Icon Styling */
	.action-btn img {
		width: 18px;
		height: 18px;
	}

	/* Icon Color Handling */
	.action-btn:hover img,
	.action-btn.active img {
		filter: brightness(0) invert(1);
	}

	/* Dark theme icon adjustments */
	[data-theme="dark"] .action-btn img {
		filter: brightness(0) invert(1);
	}

	[data-theme="dark"] .action-btn:hover img,
	[data-theme="dark"] .action-btn.active img {
		filter: brightness(1) invert(0);
	}

	/* ===================================================================
	   GRADIENT BUTTONS
	   =================================================================== */
	.gradient-btn {
		/* Layout */
		width: 28px;
		height: 28px;
		
		/* Visual */
		border: 2px solid var(--color-border);
		border-radius: var(--radius-sm);
		overflow: hidden;
		
		/* Interaction */
		cursor: pointer;
	}

	.gradient-btn:hover {
		border-color: var(--color-accent);
	}

	.gradient-btn.active {
		border-color: var(--color-accent);
		outline: 1px solid var(--color-accent);
	}

	.gradient-btn svg {
		width: 100%;
		height: 100%;
		display: block;
	}

	/* ===================================================================
	   SELECT DROPDOWN
	   =================================================================== */
	.toolbar-select {
		/* Layout */
		min-width: 120px;
		
		/* Visual */
		background: var(--color-surface);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-md);
		color: var(--color-text-primary);
		
		/* Typography */
		font-family: inherit;
		font-size: var(--font-size-sm);
		
		/* Spacing */
		padding: var(--space-sm) var(--space-md);
		
		/* Interaction */
		cursor: pointer;
	}

	.toolbar-select:hover {
		border-color: var(--color-accent);
	}

	.toolbar-select:focus {
		outline: none;
		border-color: var(--color-accent);
	}

	/* ===================================================================
	   SLIDER COMPONENT
	   =================================================================== */
	.slider-section {
		display: flex;
		align-items: center;
		gap: var(--space-md);
	}

	/* Budget Display */
	.budget-display {
		/* Visual */
		background: var(--color-surface);
		border: 1px solid var(--color-border);
		border-radius: var(--radius-sm);
		color: var(--color-text-primary);
		
		/* Typography */
		font-size: var(--font-size-xs);
		font-weight: var(--font-weight-medium);
		
		/* Spacing */
		padding: var(--space-xs) var(--space-sm);
		min-width: 64px;
		text-align: center;
	}

	/* jQuery UI Slider Overrides */
	.ui-slider {
		background: var(--color-border) !important;
		border: none !important;
		border-radius: 10px !important;
		height: 3px !important;
		width: 100px !important;
	}

	.ui-slider .ui-slider-handle {
		background: var(--color-accent) !important;
		border: 2px solid white !important;
		border-radius: 50% !important;
		width: 14px !important;
		height: 14px !important;
		top: -5px !important;
		cursor: pointer !important;
	}

	.ui-slider .ui-slider-handle:hover {
		background: var(--color-accent-hover) !important;
	}

	.ui-slider .ui-slider-handle:focus {
		outline: none !important;
	}

	/* ===================================================================
	   TOOLTIPS
	   =================================================================== */
	.tooltip {
		/* Positioning */
		position: absolute;
		bottom: -32px;
		left: 50%;
		transform: translateX(-50%);
		z-index: 1000;
		
		/* Visual */
		background: rgba(0, 0, 0, 0.9);
		color: white;
		border-radius: var(--radius-sm);
		
		/* Typography */
		font-size: var(--font-size-xs);
		white-space: nowrap;
		
		/* Spacing */
		padding: var(--space-xs) var(--space-sm);
		
		/* Animation */
		opacity: 0;
		pointer-events: none;
	}

	/* Show tooltip on hover */
	.action-btn:hover .tooltip,
	.gradient-btn:hover .tooltip {
		opacity: 1;
	}

	/* ===================================================================
	   RESPONSIVE DESIGN
	   =================================================================== */
	
	/* Large screens - default layout */
	@media (min-width: 1200px) {
		#potree_toolbar {
			gap: var(--space-xxl);
		}
	}

	/* Medium screens - reduce gaps */
	@media (max-width: 1199px) and (min-width: 768px) {
		#potree_toolbar {
			left: var(--space-lg);
			right: var(--space-lg);
			transform: none;
			gap: var(--space-lg);
		}
		
		#potree_control_toolbar {
			right: var(--space-lg);
		}
	}

	/* Small screens - stack sections */
	@media (max-width: 767px) {
		#potree_toolbar {
			left: var(--space-sm);
			right: var(--space-sm);
			transform: none;
			flex-direction: column;
			gap: var(--space-lg);
			padding: var(--space-lg);
		}
		
		#potree_control_toolbar {
			right: var(--space-sm);
			top: calc(var(--space-xl) + 100px); /* Position below main toolbar with more spacing */
		}
		
		.toolbar-separator {
			width: 80px;
			height: 1px;
		}
		
		.toolbar-section {
			justify-content: center;
		}
		
		.toolbar-label {
			min-width: auto;
		}
	}

	/* ===================================================================
	   ACCESSIBILITY
	   =================================================================== */
	
	/* Focus styles for keyboard navigation */
	.action-btn:focus,
	.gradient-btn:focus {
		outline: 2px solid var(--color-accent);
		outline-offset: 2px;
	}
	</style>
</head>

<body>
	<!-- ===================================================================
	     JAVASCRIPT DEPENDENCIES
	     =================================================================== -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>
	<script src='../libs/sql.js/sql-wasm.js'></script>
	<script src='../libs/geopackage/geopackage.js'></script>

	<!-- ===================================================================
	     HTML STRUCTURE
	     =================================================================== -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area">
			<!-- Main Toolbar -->
			<div id="potree_toolbar">
				<!-- populated with function -->
			</div>
			
			<!-- Darkmode and Menu Toolbar -->
			<div id="potree_control_toolbar">
				<div class="control-btn" id="sidebar-toggle" title="Toggle Sidebar">
					<div class="hamburger">
						<div class="hamburger-line"></div>
						<div class="hamburger-line"></div>
						<div class="hamburger-line"></div>
					</div>
				</div>
				<div class="control-btn" id="theme-toggle" title="Toggle Theme">
					🌙
				</div>
			</div>
		</div>
		<div id="potree_sidebar_container"> </div>
	</div>
	
	<!-- ===================================================================
	     POTREE INITIALIZATION
	     =================================================================== -->
	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";
		
		// Initialize Potree Viewer
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		// Configure viewer settings
		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");
		
		// Load GUI components
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_tools").next().show();
		});

		// Define elevation range for point cloud
		const elevationRange = [730, 790];
		
		// Load and configure point cloud
		Potree.loadPointCloud("../pointclouds/vol_total/cloud.js", "Sorvilier", e => {
			const scene = viewer.scene;
			const pointcloud = e.pointcloud;
			
			// Configure material properties
			const material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;
			material.elevationRange = elevationRange;
			
			// Add to scene and set camera view
			scene.addPointCloud(pointcloud);
			scene.view.setView(
				[590144.208, 231895.191, 1077.020],
				[589800.000, 231432.852, 756.242],
			);
		});
	</script>

	<!-- ===================================================================
	     TOOLBAR FUNCTIONALITY
	     =================================================================== -->
	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";
		
		// ===============================================
		// THEME MANAGEMENT
		// ===============================================
		
		// Get theme preference from localStorage or default to light
		let isDarkMode = localStorage.getItem('potree-dark-mode') === 'true';
		
		/**
		 * Updates the theme throughout the application
		 */
		function updateTheme() {
			const body = document.body;
			const themeToggle = document.getElementById('theme-toggle');
			
			if (isDarkMode) {
				body.setAttribute('data-theme', 'dark');
				themeToggle.textContent = '☀️';
				themeToggle.title = 'Switch to Light Mode';
			} else {
				body.removeAttribute('data-theme');
				themeToggle.textContent = '🌙';
				themeToggle.title = 'Switch to Dark Mode';
			}
			
			// Persist theme preference
			localStorage.setItem('potree-dark-mode', isDarkMode);
		}
		
		// Initialize theme on page load
		updateTheme();
		
		// Theme toggle event listener
		document.getElementById('theme-toggle').addEventListener('click', () => {
			isDarkMode = !isDarkMode;
			updateTheme();
		});

		// Sidebar toggle event listener
		document.getElementById('sidebar-toggle').addEventListener('click', () => {
			// Toggle sidebar visibility - this will integrate with Potree's sidebar system
			if (typeof viewer !== 'undefined' && viewer.toggleSidebar) {
				viewer.toggleSidebar();
			} else {
				// Fallback: manually toggle sidebar container
				const sidebar = document.getElementById('potree_sidebar_container');
				if (sidebar) {
					sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
				}
			}
		});

		// ===============================================
		// TOOLBAR HTML GENERATION
		// ===============================================
		
		const elToolbar = $("#potree_toolbar");
		
		// Build the toolbar structure with all sections
		elToolbar.append(`
			<!-- Attribute Control Section -->
			<div class="toolbar-section">
				<div class="toolbar-label">View</div>
				<div class="toolbar-controls">
					<div class="action-btn" data-action="elevation" title="Show elevation data">
						<img src="${Potree.resourcePath}/icons/profile.svg" alt="Elevation"/>
						<div class="tooltip">Elevation</div>
					</div>
					<div class="action-btn active" data-action="rgb" title="Show RGB colors">
						<img src="${Potree.resourcePath}/icons/rgb.svg" alt="RGB"/>
						<div class="tooltip">RGB</div>
					</div>
				</div>
			</div>

			<div class="toolbar-separator"></div>

			<!-- Gradient Selection Section 
			<div class="toolbar-section">
				<div class="toolbar-label">Gradient</div>
				<div class="toolbar-controls" id="gradient-container">
				</div>
			</div>
			-->

			<div class="toolbar-section">
				<div class="toolbar-label">NAVIGATION</div>
				<div class="toolbar-controls" id="navigation_sma">			
			</div>

			<div class="toolbar-separator"></div>

			<div class="toolbar-section">
				<div class="toolbar-label">VIEWS</div>
				<div class="toolbar-controls" id="viewscontrol_sma">			
			</div>

			<div class="toolbar-separator"></div>

			<!-- Measurement Tools Section -->
			<div class="toolbar-section">
				<div class="toolbar-label">Measure</div>
				<div class="toolbar-controls">
					<div class="action-btn" data-action="measure-point" title="Measure single point">
						<img src="${Potree.resourcePath}/icons/point.svg" alt="Point"/>
						<div class="tooltip">Point</div>
					</div>
					<div class="action-btn" data-action="measure-distance" title="Measure distance">
						<img src="${Potree.resourcePath}/icons/distance.svg" alt="Distance"/>
						<div class="tooltip">Distance</div>
					</div>
					<div class="action-btn" data-action="measure-circle" title="Measure circle">
						<img src="${Potree.resourcePath}/icons/circle.svg" alt="Circle"/>
						<div class="tooltip">Circle</div>
					</div>
				</div>
			</div>

			<div class="toolbar-separator"></div>

			<!-- Material Selection Section -->
			<div class="toolbar-section">
				<div class="toolbar-label">Material</div>
				<div class="toolbar-controls">
					<select id="optMaterial" class="toolbar-select" title="Select material attribute">
						<option value="rgba">RGB</option>
						<option value="elevation">Elevation</option>
						<option value="level of detail">Level of Detail</option>
						<option value="indices">Indices</option>
					</select>
				</div>
			</div>

			<div class="toolbar-separator"></div>

			<!-- Point Budget Control Section -->
			<div class="toolbar-section">
				<div class="toolbar-label">Budget</div>
				<div class="toolbar-controls">
					<div class="slider-section">
						<div id="lblPointBudget" class="budget-display">1.0M</div>
						<div id="sldPointBudget"></div>
					</div>
				</div>
			</div>
		`);

		// ===============================================
		// ATTRIBUTE CONTROL HANDLERS
		// ===============================================
		
		/**
		 * Handles elevation view activation
		 */
		elToolbar.find('.action-btn[data-action="elevation"]').click(function() {
			// Clear measurement tool states
			elToolbar.find('.action-btn[data-action^="measure-"]').removeClass('active');
			
			// Update attribute button states
			elToolbar.find('.action-btn[data-action="elevation"], .action-btn[data-action="rgb"]').removeClass('active');
			$(this).addClass('active');
			
			// Apply elevation attribute to all point clouds
			viewer.scene.pointclouds.forEach(pc => pc.material.activeAttributeName = "elevation");
		});

		/**
		 * Handles RGB view activation
		 */
		elToolbar.find('.action-btn[data-action="rgb"]').click(function() {
			// Clear measurement tool states
			elToolbar.find('.action-btn[data-action^="measure-"]').removeClass('active');
			
			// Update attribute button states
			elToolbar.find('.action-btn[data-action="elevation"], .action-btn[data-action="rgb"]').removeClass('active');
			$(this).addClass('active');
			
			// Apply RGB attribute to all point clouds
			viewer.scene.pointclouds.forEach(pc => pc.material.activeAttributeName = "rgba");
		});

		// ===============================================
		// GRADIENT CONTROL GENERATION
		// ===============================================
		
		// Get available gradient schemes from Potree
		const schemes = Object.keys(Potree.Gradients).map(name => ({
			name: name, 
			values: Potree.Gradients[name]
		}));
		
		const gradientContainer = $('#gradient-container');

		/**
		 * Creates gradient buttons for each available scheme
		 */
		schemes.forEach((scheme, index) => {
			// Create SVG gradient visualization
			const svg = Potree.Utils.createSvgGradient(scheme.values);
			svg.style.width = "100%";
			svg.style.height = "100%";

			// Create button element
			const gradientBtn = $(`
				<div class="gradient-btn ${index === 0 ? 'active' : ''}" 
				     title="Apply ${scheme.name} gradient">
					<div class="tooltip">${scheme.name}</div>
				</div>
			`);
			
			// Add SVG to button
			gradientBtn.append(svg);
			
			// Handle gradient selection
			gradientBtn.click(function() {
				// Update button states
				gradientContainer.find('.gradient-btn').removeClass('active');
				$(this).addClass('active');
				
				// Apply gradient to all point clouds
				for(const pointcloud of viewer.scene.pointclouds) {
					pointcloud.material.activeAttributeName = "elevation";
					pointcloud.material.gradient = Potree.Gradients[scheme.name];
				}
				
				// Also activate elevation view
				elToolbar.find('.action-btn[data-action="elevation"], .action-btn[data-action="rgb"]').removeClass('active');
				elToolbar.find('.action-btn[data-action="elevation"]').addClass('active');
			});
			
			// Add to container
			gradientContainer.append(gradientBtn);
		});

		// ===============================================
		// MEASUREMENT TOOL HANDLERS
		// ===============================================
		
		/**
		 * Handles point measurement tool activation
		 */
		elToolbar.find('.action-btn[data-action="measure-point"]').click(function() {
			elToolbar.find('.action-btn[data-action^="measure-"]').removeClass('active');
			$(this).addClass('active');
			
			viewer.measuringTool.startInsertion({
				showDistances: false,
				showAngles: false,
				showCoordinates: true,
				showArea: false,
				closed: true,
				maxMarkers: 1,
				name: 'Point'
			});
		});

		/**
		 * Handles distance measurement tool activation
		 */
		elToolbar.find('.action-btn[data-action="measure-distance"]').click(function() {
			elToolbar.find('.action-btn[data-action^="measure-"]').removeClass('active');
			$(this).addClass('active');
			
			viewer.measuringTool.startInsertion({
				showDistances: true,
				showArea: false,
				closed: false,
				name: 'Distance'
			});
		});

		/**
		 * Handles circle measurement tool activation
		 */
		elToolbar.find('.action-btn[data-action="measure-circle"]').click(function() {
			elToolbar.find('.action-btn[data-action^="measure-"]').removeClass('active');
			$(this).addClass('active');
			
			viewer.measuringTool.startInsertion({
				showDistances: false,
				showHeight: false,
				showArea: false,
				showCircle: true,
				showEdges: false,
				closed: false,
				maxMarkers: 3,
				name: 'Circle'
			});
		});

		// ===============================================
		// MATERIAL SELECTION HANDLER
		// ===============================================
		
		/**
		 * Handles material dropdown changes
		 */
		$('#optMaterial').change(function() {
			const selectedValue = $(this).val();
			
			// Apply material to all point clouds
			viewer.scene.pointclouds.forEach(pc => pc.material.activeAttributeName = selectedValue);
			
			// Update corresponding attribute buttons
			elToolbar.find('.action-btn[data-action="elevation"], .action-btn[data-action="rgb"]').removeClass('active');
			if (selectedValue === 'rgba') {
				elToolbar.find('.action-btn[data-action="rgb"]').addClass('active');
			} else if (selectedValue === 'elevation') {
				elToolbar.find('.action-btn[data-action="elevation"]').addClass('active');
			}
		});

		// ===============================================
		// POINT BUDGET SLIDER
		// ===============================================
		
		/**
		 * Initialize the point budget slider with smooth movement
		 */
		$('#sldPointBudget').slider({
			value: viewer.getPointBudget(),
			min: 100_000,
			max: 1_000_000,
			step: 1_000, // Much smaller steps for smoother movement
			slide: (event, ui) => { 
				viewer.setPointBudget(ui.value); 
			}
		});

		/**
		 * Updates the point budget display
		 */
		const updateBudgetDisplay = () => {
			const budget = (viewer.getPointBudget() / 1_000_000).toFixed(1) + "M";
			$('#lblPointBudget').text(budget);
		};

		// Initialize display and listen for changes
		updateBudgetDisplay();
		viewer.addEventListener("point_budget_changed", updateBudgetDisplay);
	</script>
	
</body>
</html>
